<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGAWORKS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 {
      font-size: 36px;
      letter-spacing: 4px;
      color: #6C63FF;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 40px;
    }
    .apps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }
    .app-card {
      background: #1e1e2e;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: #fff;
      border: 1px solid #2e2e4e;
      transition: border-color 0.2s;
    }
    .app-card:hover { border-color: #6C63FF; }
    .app-icon { font-size: 32px; }
    .app-info { display: flex; flex-direction: column; }
    .app-name { font-size: 16px; font-weight: 600; }
    .app-desc { font-size: 13px; color: #888; margin-top: 2px; }
    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #555;
    }
    .footer a { color: #6C63FF; text-decoration: none; }
  </style>
</head>
<body>
  <h1>SAGAWORKS</h1>
  <p>Independent app & game developer</p>

  <div class="apps">
    <a class="app-card" href="https://play.google.com/store/apps/details?id=com.sagaworks.exact_weather" target="_blank">
      <span class="app-icon">🌤️</span>
      <div class="app-info">
        <span class="app-name">정확한 날씨</span>
        <span class="app-desc">Exact Weather — 세 가지 날씨 소스 비교</span>
      </div>
    </a>
  </div>

  <div class="footer">
    <a href="/privacy_policy.html">개인정보처리방침</a> &nbsp;|&nbsp;
    sagaworks2025@gmail.com
  </div>
</body>
</html>
